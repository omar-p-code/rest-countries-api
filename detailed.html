<!DOCTYPE html>
<html class="details" lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="keywards" content="HTML, CSS, JavaScript, Rest country API, API, Coutries">
    <meta name="discreption" content="This is a simple website that uses the Rest country API to display information about countries.">
    <meta name="author" content="Omar Matar">
    <link rel="preload" as="style" href="./fontawesome-free/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" as="style" href="./css/style.css" onload="this.onload=null;this.rel='stylesheet'">
  </head>
  <body>
    <header>
      <div class="text">Where in the world?</div>
      <div class="mode"><i class="fa-regular fa-moon"></i> Dark Mode</div>
    </header>
    <div class="back">&larr; Back</div>
    <div class="details">
      <div class="image"><img loading="lazy"></div>
      <div class="info">
        <div class="name"></div>
        <div class="country-info">
          <div class="country-details">
            <div class="native-name"></div>
            <div class="population"></div>
            <div class="region"></div>
            <div class="sub-region"></div>
            <div class="capital"></div>
          </div>
          <div class="country-meta">
            <div class="top-level-domain"></div>
            <div class="currencies"></div>
            <div class="languages"></div>
          </div>
        </div>
        <div class="country-borders"><span>Borders Countries:</span>
          <div class="borders"></div>
        </div>
      </div>
    </div>
  </body>
  <script src="./fontawesome-free/js/all.min.js" defer></script>
  <script src="./js/jquery-3.7.1.min.js" defer></script>
  <script src="./js/main.js" defer></script>
</html>
